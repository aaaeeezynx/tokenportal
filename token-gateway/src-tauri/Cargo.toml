[package]
name = "tokenportal"
version = "0.1.3"
description = "Local AI toll booth — meter, route, and account for every token your coding agents spend"
authors = ["aaaeeezynx"]
edition = "2021"
default-run = "tokenportal"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tokenportal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order：JSON 物件的鍵序照原樣保留。MCP 會改寫使用者的 ~/.claude.json
# 與 opencode.json；沒有這個特性時 serde_json 會把鍵**按字母排序**，
# 一次「開關伺服器」就讓整份檔案看起來被翻掉。indexmap 已在離線快取中。
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
chrono = "0.4"
thiserror = "2"
dirs = "6"
toml_edit = "0.22"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
rand = "0.9"
sha2 = "0.10"
# Skills（P3.3）：GitHub 的 tarball 是 .tar.gz，需要 gunzip（tar 的解析自己寫，
# 只需要讀 header，見 skills/tarball.rs；離線快取裡有 flate2）。
flate2 = "1"

[dev-dependencies]
tempfile = "3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
